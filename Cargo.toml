[package]
name = "pub-sub-tui"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
description = "A TUI for monitoring a Google Pub/Sub instance (typically the local emulator) by transparently proxying and observing its gRPC and REST traffic."

# The headless monitor service: interception proxy + poller + state-streaming server.
[[bin]]
name = "pub-sub-monitor"
path = "src/bin/pub-sub-monitor.rs"

# The terminal UI: connects to a (possibly remote) monitor and displays its state.
[[bin]]
name = "pub-sub-tui"
path = "src/bin/pub-sub-tui.rs"

# Traffic generator: drives demo pub/sub traffic through the proxy.
[[bin]]
name = "pub-sub-loadgen"
path = "src/bin/pub-sub-loadgen.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
# `gzip` enables gRPC message compression support. Pub/Sub clients (e.g. the
# google-cloud-pubsub Ruby gem's async publisher with `compress: true`) gzip
# publish payloads above a size threshold; without this feature tonic cannot
# decode such requests and the (otherwise transparent) proxy silently stalls them.
tonic = { version = "0.14", features = ["gzip"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
bytes = "1"
futures = "0.3"
# The proxy serves Pub/Sub's REST/JSON API alongside gRPC on the same port, so it
# needs an HTTP/1.1 stack of its own: `axum` (the router tonic itself routes with,
# for the non-gRPC fallback), `hyper`/`hyper-util` for the client leg upstream and
# `http`/`http-body-util` for the message plumbing in between. All four are already
# in the tree as tonic's own dependencies; the versions here track its.
axum = { version = "0.8", default-features = false }
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# Decodes the `data` field of a REST message, which proto3's JSON mapping carries
# as base64, for the recent-messages view.
base64 = "0.22"
# Decodes gzipped REST bodies for observation (the compressed body itself is
# relayed untouched); the gRPC side gets the equivalent from tonic's `gzip`.
flate2 = "1"
# `sync` enables `wrappers::WatchStream`, used by the state-streaming server to
# turn the observer's `watch` channel into a gRPC response stream.
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
tui-tree-widget = "0.24"
# Used by the UI to detect and pretty-print JSON message payloads in the
# recent-messages content viewer.
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
scopeguard = "1"
# `gcloud-pubsub` is the current name of the crate formerly published as
# `google-cloud-pubsub` (the name the README refers to); aliased back to keep the
# import path and dependency key faithful to that name.
google-cloud-pubsub = { package = "gcloud-pubsub", version = "1.7" }
# Needed only to name `Environment::Emulator`, so the poller targets the real
# upstream explicitly rather than via the `PUBSUB_EMULATOR_HOST` env var (which
# clients point at this proxy).
google-cloud-gax = { package = "gcloud-gax", version = "1.4" }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
# Provides `PubsubMessage` for the emulator integration tests (the message type
# the pubsub client publishes); a transitive dep of `google-cloud-pubsub`.
google-cloud-googleapis = { package = "gcloud-googleapis", version = "1.3" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
# Forbid `.unwrap()` across the codebase: a stray unwrap is a latent panic. This
# is a `restriction`-group lint (not part of `all`), so it must be opted into
# explicitly. Test code is exempted via `allow-unwrap-in-tests` in clippy.toml.
# `expect` is deliberately *not* forbidden — it stays available, with a
# justifying message, for genuine by-construction invariants.
unwrap_used = "deny"
