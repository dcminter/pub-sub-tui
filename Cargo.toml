[package]
name = "pub-sub-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A TUI for monitoring a Google Pub/Sub instance (typically the local emulator) by transparently proxying and observing its gRPC traffic."

# The headless monitor service: interception proxy + poller + state-streaming server.
[[bin]]
name = "pub-sub-monitor"
path = "src/bin/pub-sub-monitor.rs"

# The terminal UI: connects to a (possibly remote) monitor and displays its state.
[[bin]]
name = "pub-sub-tui"
path = "src/bin/pub-sub-tui.rs"

# Traffic generator: drives demo pub/sub traffic through the proxy.
[[bin]]
name = "pub-sub-loadgen"
path = "src/bin/pub-sub-loadgen.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
bytes = "1"
futures = "0.3"
# `sync` enables `wrappers::WatchStream`, used by the state-streaming server to
# turn the observer's `watch` channel into a gRPC response stream.
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.30"
tui-tree-widget = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
scopeguard = "1"
# `gcloud-pubsub` is the current name of the crate formerly published as
# `google-cloud-pubsub` (the name the README refers to); aliased back to keep the
# import path and dependency key faithful to that name.
google-cloud-pubsub = { package = "gcloud-pubsub", version = "1.7" }
# Needed only to name `Environment::Emulator`, so the poller targets the real
# upstream explicitly rather than via the `PUBSUB_EMULATOR_HOST` env var (which
# clients point at this proxy).
google-cloud-gax = { package = "gcloud-gax", version = "1.4" }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
# Provides `PubsubMessage` for the emulator integration tests (the message type
# the pubsub client publishes); a transitive dep of `google-cloud-pubsub`.
google-cloud-googleapis = { package = "gcloud-googleapis", version = "1.3" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
